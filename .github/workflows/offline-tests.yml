name: Offline reproducibility
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip check
      - run: python -m evaluation_toolkit check
      - run: python -m unittest discover -s tests -v
      - run: python -m evaluation_toolkit demo --output_dir eval_result/ci-demo
      - run: python -m evaluation_toolkit run --model gpt-4o --track both --limit 2 --as_of 2026-10-16 --run_dir eval_result/ci-smoke --dry_run
